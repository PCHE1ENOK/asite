<title>Ai — прототип</title>
<meta name="claude:viewport-fit-sides" content="cover">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Golos+Text:wght@400;500;600&family=Unbounded:wght@500;600&display=swap">
<style>
/* Layout: окно Windows 11 — строка заголовка 32, навигация слева 72 (снизу на телефоне), контент прокручивается; плеер — чёрная сцена с оверлеем.
   Цвета и размеры повторяют design/tokens.json. Тема по умолчанию тёмная. */
:root {
  color-scheme: dark;
  --bg:#0E1016; --s1:#161923; --s2:#1E2230; --s3:#272C3D;
  --border:#2C3144; --border-strong:#3B4159;
  --fg:#ECEEF5; --fg2:#A7ADC0; --fg3:#878EA4;
  --accent:#8399FF; --accent-hover:#9AACFF; --accent-pressed:#6F86F2; --on-accent:#0E1016; --accent-soft:#8399FF26;
  --good:#4CC38A; --warn:#E3A73B; --bad:#F27B7B;
  --st-current:#3987E5; --st-planning:#D95926; --st-completed:#199E70; --st-paused:#C98500; --st-dropped:#D55181;
  --skel:#1E2230; --skel-shine:#272C3D;
  --shadow-2:0 8px 24px #00000080; --shadow-3:0 16px 48px #000000A0;
  --hover:#ECEEF50F; --pressed:#ECEEF51F;
  /* плеер всегда тёмный */
  --pl-fg:#FFFFFF; --pl-fg2:#FFFFFFB8; --pl-panel:#161923E6; --pl-track:#FFFFFF33; --pl-buf:#FFFFFF59;
  --badge-ground:#0E1016CC;

  --f-display:"Unbounded","Segoe UI Variable Display","Segoe UI",system-ui,sans-serif;
  --f-text:"Golos Text","Segoe UI Variable Text","Segoe UI",system-ui,sans-serif;
  --r-xs:4px; --r-sm:6px; --r-md:10px; --r-lg:16px; --r-pill:999px;
  --ease:cubic-bezier(.2,0,0,1);
}
@media (prefers-color-scheme: light) {
  :root:not([data-theme="dark"]) {
    color-scheme: light;
    --bg:#F4F5F9; --s1:#FFFFFF; --s2:#E9EBF2; --s3:#DEE1EA;
    --border:#D9DCE6; --border-strong:#BFC3D1;
    --fg:#141722; --fg2:#474D62; --fg3:#646A80;
    --accent:#3150C9; --accent-hover:#2944B3; --accent-pressed:#22399A; --on-accent:#FFFFFF; --accent-soft:#3150C91F;
    --good:#126F48; --warn:#94580A; --bad:#B9302F;
    --st-current:#2A78D6; --st-planning:#EB6834; --st-completed:#1BAF7A; --st-paused:#EDA100; --st-dropped:#E87BA4;
    --skel:#E9EBF2; --skel-shine:#F4F5F9;
    --shadow-2:0 8px 24px #14172224; --shadow-3:0 16px 48px #1417222E;
    --hover:#1417220F; --pressed:#1417221F;
  }
}
:root[data-theme="light"] {
  color-scheme: light;
  --bg:#F4F5F9; --s1:#FFFFFF; --s2:#E9EBF2; --s3:#DEE1EA;
  --border:#D9DCE6; --border-strong:#BFC3D1;
  --fg:#141722; --fg2:#474D62; --fg3:#646A80;
  --accent:#3150C9; --accent-hover:#2944B3; --accent-pressed:#22399A; --on-accent:#FFFFFF; --accent-soft:#3150C91F;
  --good:#126F48; --warn:#94580A; --bad:#B9302F;
  --st-current:#2A78D6; --st-planning:#EB6834; --st-completed:#1BAF7A; --st-paused:#EDA100; --st-dropped:#E87BA4;
  --skel:#E9EBF2; --skel-shine:#F4F5F9;
  --shadow-2:0 8px 24px #14172224; --shadow-3:0 16px 48px #1417222E;
  --hover:#1417220F; --pressed:#1417221F;
}

/* Скрытое скрыто всегда, даже если у элемента свой display (панели, меню, тосты) и даже когда файл открыт без обёртки публикации */
[hidden] { display: none !important; pointer-events: none !important; }
html, body { height: 100%; }
body { background: var(--bg); color: var(--fg); font: 400 15px/22px var(--f-text); overflow: hidden; }
* { box-sizing: border-box; }
button, input, select { font: inherit; color: inherit; }
button { cursor: pointer; background: none; border: 0; padding: 0; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; border-radius: var(--r-sm); }
svg { width: 20px; height: 20px; fill: currentColor; flex: none; }
.num { font-variant-numeric: tabular-nums; }

/* ---------- окно ---------- */
.app { height: 100%; height: 100dvh; display: grid; grid-template-rows: 32px minmax(0, 1fr); grid-template-columns: minmax(0, 1fr); }
.device { display: grid; grid-template-columns: 72px minmax(0, 1fr); grid-template-rows: minmax(0, 1fr); min-height: 0; position: relative; transform: translateZ(0); background: var(--bg); }
.device > .rail { grid-column: 1; grid-row: 1; }
.device > .main { grid-column: 2; grid-row: 1; }
.sbar, .mnav, .pl-center, .homebar { display: none; }
.titlebar { grid-column: 1 / -1; display: flex; align-items: center; gap: 12px; padding-left: max(16px, env(safe-area-inset-left, 0px)); background: var(--bg); border-bottom: 1px solid var(--border); font-size: 12px; color: var(--fg2); -webkit-user-select: none; user-select: none; }
.titlebar .brand { font: 600 12px/1 var(--f-display); color: var(--fg); letter-spacing: .02em; }
.titlebar { position: relative; }
.titlebar .proto-toggle { margin-left: auto; }
/* Демо-настройки прототипа — выпадающая панель, чтобы строка заголовка помещалась при любой ширине */
.titlebar .proto { display: none; position: absolute; top: 32px; right: 8px; z-index: 100; width: min(640px, calc(100vw - 16px)); grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 10px; padding: 12px; background: var(--s1); border: 1px solid var(--border); border-radius: var(--r-md); box-shadow: var(--shadow-3); }
.titlebar.open .proto { display: grid; }
.titlebar .proto .pf { display: grid; gap: 2px; min-width: 0; }
.titlebar .proto select { width: 100%; min-width: 0; height: 28px; }
.titlebar .proto #themeBtn { height: 28px; align-self: end; }
.titlebar .proto label { color: var(--fg3); }
.proto-toggle { display: inline-flex; align-items: center; }
.titlebar select, .titlebar .tb-btn { height: 24px; border: 1px solid var(--border); background: var(--s1); border-radius: var(--r-xs); padding: 0 6px; font-size: 12px; }
.winbtns { display: flex; padding-right: max(0px, env(safe-area-inset-right, 0px)); }
.winbtns span { width: 46px; height: 32px; display: grid; place-items: center; color: var(--fg2); }
.winbtns svg { width: 12px; height: 12px; }

.rail { background: var(--bg); border-right: 1px solid var(--border); display: flex; flex-direction: column; align-items: center; gap: 4px; padding: 12px 0; }
.rail a { width: 56px; padding: 8px 0 6px; border-radius: var(--r-sm); display: flex; flex-direction: column; align-items: center; gap: 2px; color: var(--fg2); text-decoration: none; font-size: 11px; line-height: 14px; position: relative; }
.rail a:hover { background: var(--hover); color: var(--fg); }
.rail a[aria-current="page"] { color: var(--fg); background: var(--accent-soft); }
.rail a[aria-current="page"]::before { content: ""; position: absolute; left: -8px; top: 14px; bottom: 14px; width: 3px; border-radius: 2px; background: var(--accent); }
.rail .spacer { flex: 1; }
.avatar { width: 32px; height: 32px; border-radius: 50%; background: linear-gradient(135deg, #3987E5, #8399FF); display: grid; place-items: center; font: 600 12px var(--f-display); color: #0E1016; }

.main { overflow: auto; min-width: 0; position: relative; }
.page { padding-block: 24px 48px; padding-left: max(32px, env(safe-area-inset-left, 0px)); padding-right: max(32px, env(safe-area-inset-right, 0px)); max-width: 1600px; }

h1 { font: 600 32px/40px var(--f-display); letter-spacing: -.5px; margin: 0; text-wrap: balance; }
h2 { font: 600 22px/28px var(--f-display); letter-spacing: -.2px; margin: 0; text-wrap: balance; }
h3 { font: 600 18px/24px var(--f-text); margin: 0; }
.overline { font: 600 11px/14px var(--f-text); letter-spacing: .08em; text-transform: uppercase; color: var(--fg3); }
.cap { font-size: 12px; line-height: 16px; color: var(--fg2); }
.muted { color: var(--fg3); }

.head { display: flex; align-items: center; gap: 16px; flex-wrap: wrap; margin-bottom: 20px; }
.search { margin-left: auto; display: flex; align-items: center; gap: 8px; height: 36px; width: min(320px, 100%); padding: 0 10px; border: 1px solid var(--border); border-radius: var(--r-sm); background: var(--s1); color: var(--fg3); }
.search input { border: 0; background: none; outline: none; flex: 1; min-width: 0; color: var(--fg); }
.kbd { font-size: 11px; border: 1px solid var(--border); border-radius: var(--r-xs); padding: 0 5px; color: var(--fg3); }

/* ---------- контролы ---------- */
.toolbar { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; margin-bottom: 24px; }
.chip { height: 32px; padding: 0 12px; border: 1px solid var(--border); border-radius: var(--r-pill); display: inline-flex; align-items: center; gap: 6px; font-size: 13px; font-weight: 500; color: var(--fg2); background: var(--s1); transition: background .15s var(--ease); }
.chip:hover { background: var(--s2); color: var(--fg); }
.chip:active { background: var(--s3); }
.chip[aria-pressed="true"] { background: var(--accent-soft); border-color: transparent; color: var(--accent); }
.chip svg { width: 16px; height: 16px; }
.sep { width: 1px; height: 20px; background: var(--border); margin: 0 4px; }
.toolbar .right { margin-left: auto; display: flex; gap: 8px; align-items: center; }
.select { height: 32px; border: 1px solid var(--border); border-radius: var(--r-sm); background: var(--s1); padding: 0 8px; font-size: 13px; }

.btn { height: 40px; padding: 0 16px; border-radius: var(--r-sm); display: inline-flex; align-items: center; gap: 8px; font-weight: 600; font-size: 14px; transition: background .15s var(--ease); white-space: nowrap; }
.btn-filled { background: var(--accent); color: var(--on-accent); }
.btn-filled:hover { background: var(--accent-hover); }
.btn-filled:active { background: var(--accent-pressed); }
.btn-tonal { background: var(--accent-soft); color: var(--accent); }
.btn-tonal:hover { background: color-mix(in srgb, var(--accent) 22%, transparent); }
.btn-outline { border: 1px solid var(--border-strong); color: var(--fg); }
.btn-outline:hover { background: var(--hover); }
.btn-outline:active { background: var(--pressed); }
.btn-text { color: var(--accent); padding: 0 10px; height: 36px; }
.btn-text:hover { background: var(--hover); }
.btn:disabled { cursor: default; }
.btn-text:disabled { color: var(--fg2); }
.btn-text:disabled:hover { background: none; }
.icon-btn { width: 40px; height: 40px; border-radius: 50%; display: grid; place-items: center; color: var(--fg2); }
.icon-btn:hover { background: var(--hover); color: var(--fg); }

/* ---------- постеры ---------- */
.grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(148px, 1fr)); gap: 28px 20px; }
@media (min-width: 1700px) { .grid { grid-template-columns: repeat(auto-fill, minmax(180px, 1fr)); } }
.card { display: flex; flex-direction: column; gap: 8px; text-align: left; min-width: 0; border-radius: var(--r-md); }
.poster { position: relative; aspect-ratio: 2 / 3; max-width: 100%; border-radius: var(--r-md); overflow: hidden; transition: transform .22s var(--ease), box-shadow .22s var(--ease); }
@media (hover: hover) { .card:hover .poster { transform: scale(1.03); box-shadow: var(--shadow-2); } }
.card:active .poster { transform: scale(1.01); }
.art { position: absolute; inset: 0; }
.art .glyph { position: absolute; right: -6%; bottom: -8%; font: 600 120px/1 var(--f-display); color: #FFFFFF26; }
.art .ttl { position: absolute; left: 10px; right: 10px; bottom: 12px; font: 600 13px/16px var(--f-display); color: #FFFFFFE6; text-wrap: balance; }
.score { position: absolute; left: 8px; top: 8px; height: 22px; padding: 0 7px; border-radius: var(--r-xs); background: var(--badge-ground); font: 600 12px/22px var(--f-text); font-variant-numeric: tabular-nums; display: flex; gap: 4px; align-items: center; }
.score small { font-size: 10px; font-weight: 500; color: #FFFFFFB3; letter-spacing: .02em; }
.of10 { font-size: 14px; color: var(--fg3); margin-left: 2px; }
.score i { width: 6px; height: 6px; border-radius: 50%; background: currentColor; }
.score.good { color: #4CC38A; } .score.warn { color: #E3A73B; } .score.bad { color: #F27B7B; }
.stdot { position: absolute; right: 8px; top: 8px; width: 24px; height: 24px; border-radius: 50%; display: grid; place-items: center; color: #FFFFFF; box-shadow: 0 0 0 2px #0E101699; }
.stdot svg { width: 15px; height: 15px; }
.prog { position: absolute; left: 0; right: 0; bottom: 0; height: 3px; background: #FFFFFF33; }
.prog i { display: block; height: 100%; background: var(--st-current); }
.hover-cta { position: absolute; inset: auto 8px 12px 8px; opacity: 0; transform: translateY(4px); transition: .18s var(--ease); justify-content: center; }
@media (hover: hover) { .card:hover .hover-cta { opacity: 1; transform: none; } }
.card:focus-within .hover-cta { opacity: 1; transform: none; }
.card .name { font: 600 13px/18px var(--f-text); display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }

.skel { background: linear-gradient(100deg, var(--skel) 30%, var(--skel-shine) 50%, var(--skel) 70%); background-size: 300% 100%; animation: shine 1.2s linear infinite; border-radius: var(--r-xs); }
.skel.poster { border-radius: var(--r-md); }
@keyframes shine { from { background-position: 100% 0; } to { background-position: -50% 0; } }

.state { display: grid; justify-items: center; gap: 12px; text-align: center; padding: 64px 16px; color: var(--fg2); }
.state svg { width: 48px; height: 48px; color: var(--fg3); }
.state h3 { color: var(--fg); }

/* ---------- списки ---------- */
.statusbar { display: flex; gap: 2px; height: 10px; margin: 8px 0 12px; }
.statusbar i { display: block; height: 100%; min-width: 4px; }
.statusbar i:first-child { border-radius: 4px 0 0 4px; } .statusbar i:last-child { border-radius: 0 4px 4px 0; }
.legend { display: flex; flex-wrap: wrap; gap: 6px 20px; font-size: 13px; color: var(--fg2); }
.legend span { display: inline-flex; align-items: center; gap: 6px; }
.legend b { color: var(--fg); font-weight: 600; font-variant-numeric: tabular-nums; }
.legend svg { width: 16px; height: 16px; }
.tabs { display: flex; gap: 4px; border-bottom: 1px solid var(--border); margin: 24px 0; overflow-x: auto; }
.tab { padding: 10px 12px 12px; font-weight: 500; color: var(--fg2); position: relative; white-space: nowrap; display: flex; gap: 8px; align-items: center; }
.tab:hover { color: var(--fg); }
.tab[aria-selected="true"] { color: var(--fg); }
.tab[aria-selected="true"]::after { content: ""; position: absolute; left: 12px; right: 12px; bottom: -1px; height: 2px; border-radius: 2px; background: var(--accent); }
.count { font-size: 12px; padding: 0 7px; border-radius: var(--r-pill); background: var(--s2); color: var(--fg2); font-variant-numeric: tabular-nums; }
.continue { display: grid; grid-template-columns: repeat(auto-fill, minmax(260px, 1fr)); gap: 20px; margin-bottom: 32px; }
.ccard { text-align: left; display: grid; gap: 8px; min-width: 0; }
.ccard .frame { aspect-ratio: 16 / 9; max-width: 100%; border-radius: var(--r-md); position: relative; overflow: hidden; transition: box-shadow .2s var(--ease); }
@media (hover: hover) { .ccard:hover .frame { box-shadow: var(--shadow-2); } }
.ccard .play { position: absolute; inset: 0; display: grid; place-items: center; opacity: 0; transition: .18s; background: #0000004D; color: #FFFFFF; }
.ccard .play svg { width: 44px; height: 44px; }
@media (hover: hover) { .ccard:hover .play { opacity: 1; } }
.ccard:focus-visible .play { opacity: 1; }

/* ---------- карточка тайтла ---------- */
.hero { position: relative; margin: -24px calc(-1 * max(32px, env(safe-area-inset-right, 0px))) 0 calc(-1 * max(32px, env(safe-area-inset-left, 0px))); padding: 72px max(32px, env(safe-area-inset-right, 0px)) 0 max(32px, env(safe-area-inset-left, 0px)); }
.hero .banner { position: absolute; inset: 0 0 auto 0; height: 260px; }
.hero .banner::after { content: ""; position: absolute; inset: 0; background: linear-gradient(180deg, transparent 20%, var(--bg) 100%); }
.hero-row { position: relative; display: flex; gap: 32px; align-items: flex-end; flex-wrap: wrap; }
.hero-row > .poster { width: 220px; flex: none; box-shadow: var(--shadow-3); }
.hero-info { flex: 1 1 340px; min-width: 0; display: grid; gap: 12px; }
.meta { color: var(--fg2); font-size: 14px; }
.scoreblock { display: flex; gap: 28px; flex-wrap: wrap; align-items: flex-end; }
.bignum { font: 600 28px/32px var(--f-display); font-variant-numeric: tabular-nums; }
.actions { display: flex; gap: 8px; flex-wrap: wrap; position: relative; }
.menu { position: absolute; top: 44px; z-index: 20; min-width: 220px; background: var(--s2); border: 1px solid var(--border); border-radius: var(--r-md); box-shadow: var(--shadow-3); padding: 4px; }
.menu button { width: 100%; height: 36px; padding: 0 10px; border-radius: var(--r-sm); display: flex; align-items: center; gap: 10px; text-align: left; font-size: 14px; }
.menu button:hover { background: var(--hover); }
.menu .chk { margin-left: auto; color: var(--accent); }
.menu hr { border: 0; border-top: 1px solid var(--border); margin: 4px 0; }
.genres { display: flex; flex-wrap: wrap; gap: 6px; }
.tag { font-size: 12px; padding: 2px 8px; border-radius: var(--r-xs); background: var(--s2); color: var(--fg2); }

.seg { display: inline-flex; padding: 3px; background: var(--s2); border-radius: var(--r-sm); gap: 2px; flex-wrap: wrap; }
.seg button { height: 30px; padding: 0 12px; border-radius: 4px; font-size: 13px; font-weight: 500; color: var(--fg2); }
.seg button:hover { color: var(--fg); }
.seg button[aria-pressed="true"] { background: var(--s1); color: var(--fg); box-shadow: 0 1px 2px #00000033; }
.eps { display: grid; margin-top: 16px; border-top: 1px solid var(--border); }
.ep { display: grid; grid-template-columns: 40px 1fr auto 28px; gap: 12px; align-items: center; min-height: 56px; padding: 6px 12px; border-bottom: 1px solid var(--border); text-align: left; border-radius: 0; }
.ep:hover { background: var(--hover); }
.ep.cur { background: var(--accent-soft); }
.ep .n { font-variant-numeric: tabular-nums; color: var(--fg3); font-weight: 600; }
.ep .t { min-width: 0; }
.ep .t div:first-child { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.ep .bar { height: 3px; background: var(--s3); border-radius: 2px; margin-top: 4px; max-width: 200px; }
.ep .bar i { display: block; height: 100%; background: var(--accent); border-radius: 2px; }
.ep .ok { color: var(--st-completed); }
.ep.future { color: var(--fg3); cursor: default; }
.ep.future:hover { background: none; }
.cols { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); gap: 40px; }
@media (max-width: 1000px) { .cols { grid-template-columns: minmax(0, 1fr); } }
.prose { max-width: 65ch; color: var(--fg2); }
.prose p { margin: 0 0 12px; }

.chart { position: relative; }
.chart svg { width: 100%; height: auto; display: block; overflow: visible; }
.chart text { fill: var(--fg2); font: 500 11px var(--f-text); font-variant-numeric: tabular-nums; }
.chart .val { fill: var(--fg); font-weight: 600; }
.chart .bar { fill: var(--accent); }
.chart rect.hit { fill: transparent; cursor: default; }
.chart g:hover .bar, .chart g.on .bar { fill: var(--accent-hover); }
.tip { position: absolute; pointer-events: none; background: var(--s3); color: var(--fg); border: 1px solid var(--border); border-radius: var(--r-sm); padding: 6px 10px; font-size: 12px; white-space: nowrap; box-shadow: var(--shadow-2); transform: translate(-50%, -100%); }
.hscroll { display: grid; grid-auto-flow: column; grid-auto-columns: 160px; gap: 20px; overflow-x: auto; padding-bottom: 8px; }

/* ---------- плеер ---------- */
.player { position: absolute; inset: 0; background: #000; color: var(--pl-fg); overflow: hidden; }
.player.hide-ui { cursor: none; }
.frame-art { position: absolute; inset: 0; background: radial-gradient(60% 80% at 30% 40%, #3E5BA9 0%, transparent 60%), radial-gradient(50% 60% at 75% 65%, #A8455E 0%, transparent 60%), linear-gradient(160deg, #10131F, #1C1430); }
.frame-art::after { content: "кадр серии"; position: absolute; left: 50%; top: 50%; transform: translate(-50%, -50%); font: 500 13px var(--f-text); color: #FFFFFF40; letter-spacing: .1em; text-transform: uppercase; }
.player .scrim-top, .player .scrim-bot { position: absolute; left: 0; right: 0; pointer-events: none; transition: opacity .22s var(--ease); }
.player .scrim-top { top: 0; height: 140px; background: linear-gradient(#000000B3, transparent); }
.player .scrim-bot { bottom: 0; height: 200px; background: linear-gradient(transparent, #000000CC); }
.pl-top, .pl-bot { position: absolute; left: 0; right: 0; padding-left: max(24px, env(safe-area-inset-left, 0px)); padding-right: max(24px, env(safe-area-inset-right, 0px)); transition: opacity .22s var(--ease), transform .22s var(--ease); }
.pl-top { top: 0; padding-top: 16px; display: flex; gap: 12px; align-items: center; }
.pl-bot { bottom: 0; padding-bottom: max(16px, env(safe-area-inset-bottom, 0px)); display: grid; gap: 8px; }
.hide-ui .pl-top, .hide-ui .pl-bot, .hide-ui .pl-center { pointer-events: none; }
.hide-ui .pl-top, .hide-ui .scrim-top { opacity: 0; transform: translateY(-8px); }

.pl-title { min-width: 0; }

// Оценка по шкале 0–10 с одним знаком. Источник: Shikimori (если есть) или AniList (averageScore / 10).
// Внутри прототипа a.sc хранится в 0–100, сортировка не меняется.
const SHIKI = new Set([3, 11, 14, 16]);
const score10 = a => a.sc == null ? null : Math.round(a.sc) / 10;
const scoreTxt = a => a.sc == null ? '' : score10(a).toFixed(1).replace('.', ',');
const scoreSrc = a => SHIKI.has(a.id) ? 'Shikimori' : 'AniList';
const scoreSrcShort = a => SHIKI.has(a.id) ? 'Shiki' : 'AL';
const scoreCls = v => v == null ? '' : v >= 7.5 ? 'good' : v >= 6 ? 'warn' : 'bad';
const scoreBadge = (a, extra = '') => a.sc == null ? '' : `<span class="score ${scoreCls(score10(a))}" ${extra} title="Оценка ${scoreTxt(a)} из 10 · ${scoreSrc(a)}"><i></i><span class="num">${scoreTxt(a)}</span><small>${scoreSrcShort(a)}</small></span>`;
const art = (a, big) => `<div class="art" style="background:radial-gradient(70% 50% at 70% 20%, hsl(${a.h+30} 70% 62% / .55), transparent 70%), linear-gradient(165deg, hsl(${a.h} 52% 42%), hsl(${a.h+40} 58% 16%))"><span class="glyph">${esc(a.t[0])}</span>${big ? '' : `<span class="ttl">${esc(a.t)}</span>`}</div>`;
const fmtK = n => n.toLocaleString('ru-RU');

function card(a, withNote) {
  const nt = withNote && notesOf()[a.id];
  const st = a.st ? `<span class="stdot" style="background:var(${STATUS[a.st].v})" title="${STATUS[a.st].label}">${ic(a.st)}</span>` : '';
  const pr = a.st === 'CURRENT' ? `<span class="prog"><i style="width:${a.pr / a.ep * 100}%"></i></span>` : '';
  return `<div class="card">
    <a href="#title" data-open="${a.id}" class="poster" aria-label="${esc(a.t)}">${art(a)}
      ${scoreBadge(a)}${a.adult ? `<span class="adult" title="Для взрослых"${a.sc == null ? ' style="top:8px"' : ''}>18+</span>` : ''}${st}${pr}
      <span class="btn btn-filled hover-cta" aria-hidden="true">${ic('play')}Смотреть</span>${nt ? `<span class="vbadge" style="color:${VERD[nt.verdict].badge}" title="Моя заметка: ${VERD[nt.verdict].label}">${ic(VERD[nt.verdict].icon)}</span>` : ''}</a>
    <div><div class="name">${esc(a.t)}</div><div class="cap">${a.f} · ${a.y} · ${a.st === 'CURRENT' ? `${a.pr} / ${a.ep}` : a.ep} эп.</div>${nt && nt.summary ? `<div class="nsum" title="${esc(nt.summary)}">${ic('edit')}${esc(nt.summary)}</div>` : ''}</div>
  </div>`;
}

  const sorters = { pop:(a,b)=>b.pop-a.pop, score:(a,b)=>(b.sc ?? -1)-(a.sc ?? -1), new:(a,b)=>b.y-a.y, az:(a,b)=>a.t.localeCompare(b.t,'ru') };
  list.sort(sorters[S.sort]);
  if (demo === 'empty') list = [];
  let body;
  if (demo === 'loading') body = `<div class="grid" aria-busy="true">${Array.from({length:14}, () => `<div class="card"><div class="poster skel"></div><div class="skel" style="height:14px;width:85%"></div><div class="skel" style="height:12px;width:55%"></div></div>`).join('')}</div>`;
  else if (demo === 'error') body = `<div class="state">${ic('cloud')}<h3>Не удалось загрузить каталог</h3><div>Проверьте подключение к интернету и попробуйте ещё раз.</div><button class="btn btn-filled" type="button" data-act="retry">Повторить</button></div>`;

  else body = `<div class="grid">${list.map(card).join('')}</div>`;
  const active = S.genres.size || S.format !== 'all' || S.hideMine || !S.adult;
  return `<div class="page">
    <div class="head"><h1>Каталог</h1><a class="search" href="#search" style="text-decoration:none">${ic('search')}<span style="flex:1">Поиск по названию</span><span class="kbd">Ctrl K</span></a></div>

      <span class="sep"></span>
      ${GENRES.map(g => `<button class="chip" type="button" data-genre="${g}" aria-pressed="${S.genres.has(g)}">${g}</button>`).join('')}
      <span class="sep"></span>
      <button class="chip" type="button" data-act="hideMine" aria-pressed="${S.hideMine}">Скрыть из моих списков</button>
      <button class="chip" type="button" data-act="adult" aria-pressed="${S.adult}">Показывать 18+</button>
      ${active ? `<button class="btn btn-text" type="button" data-act="reset">Сбросить</button>` : ''}
      <div class="right"><label class="cap" for="sort">Сортировка</label>
        <select class="select" id="sort">
          <option value="pop"${S.sort==='pop'?' selected':''}>Популярность</option>
          <option value="score"${S.sort==='score'?' selected':''}>По оценке</option>
          <option value="new"${S.sort==='new'?' selected':''}>Новые</option>

      </a>`).join('')}</div><div class="overline" style="margin-bottom:12px">Все в «Смотрю»</div>` : '';
  const vf = S.verdictFilter || 'all';

  return `<div class="page">
    <div class="head"><h1>Мои списки</h1></div>

}

function hl(t, q) { const i = t.toLowerCase().indexOf(q.toLowerCase()); return i < 0 ? esc(t) : esc(t.slice(0,i)) + '<mark>' + esc(t.slice(i, i + q.length)) + '</mark>' + esc(t.slice(i + q.length)); }

  const res = demo === 'empty' ? [] : DATA.filter(a => (S.adult || !a.adult) && (a.t + ' ' + a.o).toLowerCase().includes(q.toLowerCase()));

  box.innerHTML = `${q.length >= 2 ? `<div class="suggest"><div>${res.slice(0,3).map(a => `<a class="sline" href="#title" data-open="${a.id}"><span class="mini">${art(a, true)}</span><span><div>${hl(a.t, q)}</div><div class="cap">${hl(a.o, q)} · ${a.f} · ${a.y}</div></span>${scoreBadge(a, 'style="position:static;margin-left:auto"')}</a>`).join('')}</div></div>` : ''}

}

  if (!st) return `<button class="btn btn-text more tr-btn" type="button" data-tr="${esc(id)}">${ic('translate')}Перевести на русский</button>`;
  if (st === 'wait') return `<div class="tr-box cap">Ждём подтверждения выше…</div>`;
  if (st === 'loading') return `<div class="tr-box" aria-busy="true"><span class="skel" style="height:12px;width:92%"></span><span class="skel" style="height:12px;width:64%"></span><span class="cap">Переводим с ${LANG_FROM[c.lang]}…</span></div>`;
  if (st === 'done') return `<div class="tr-box done" lang="ru"><span class="tr-label">${ic('translate')}Перевод с ${LANG_FROM[c.lang]} · ${via}</span><p>${esc(c.tr)}</p>
    <button class="btn btn-text more" type="button" data-trorig="${esc(id)}" aria-pressed="${TR.showOrig.has(id)}">${TR.showOrig.has(id) ? 'Скрыть оригинал' : 'Показать оригинал'}</button></div>`;
  if (st === 'pack') return `<div class="tr-box"><span>Для перевода с ${LANG_FROM[c.lang]} нужен языковой пакет на устройстве (≈ 30 МБ). Перевод выполняется на устройстве, текст никуда не отправляется.</span><button class="btn btn-outline" type="button" data-trpack="${esc(id)}">${ic('cloud_up')}Скачать пакет перевода</button></div>`;
  if (st === 'packing') { const v = TR.pack[c.lang] || 0; return `<div class="tr-box"><span>Скачиваем пакет «${LANG_TAG[c.lang]} → рус.» · <b class="num">${v}%</b></span><span class="pbar" role="progressbar" aria-valuemin="0" aria-valuemax="100" aria-valuenow="${v}"><i style="width:${v}%"></i></span></div>`; }
  if (st === 'limit') return `<div class="tr-box warn">${ic('PAUSED')}<span>Лимит перевода исчерпан, попробуйте завтра.</span></div>`;
  if (st === 'error') return `<div class="tr-box err">${ic('cloud_off')}<span>Не удалось перевести: нет сети.</span><button class="btn btn-text more" type="button" data-tr="${esc(id)}">Повторить</button></div>`;
  return '';
}
function runTranslate(id) {
  const c = COMMENTS.concat(MORE).find(x => x.a === id); if (!c) return;
  if (!isMob() && !TR.consent) { TR.pending = id; TR.st[id] = 'wait'; paintComments(); return; }
  if (isMob() && C.trDemo === 'pack' && (TR.pack[c.lang] || 0) < 100) { TR.st[id] = 'pack'; paintComments(); return; }
  if (!isMob() && C.trDemo === 'limit') { TR.st[id] = 'limit'; paintComments(); return; }
  TR.st[id] = 'loading'; paintComments();
  setTimeout(() => { TR.st[id] = C.trDemo === 'error' ? 'error' : 'done'; paintComments(); }, 700);
}
function downloadPack(id) {
  const c = COMMENTS.concat(MORE).find(x => x.a === id); TR.st[id] = 'packing'; TR.pack[c.lang] = 0; paintComments();
  const iv = setInterval(() => { TR.pack[c.lang] = Math.min(100, TR.pack[c.lang] + 20); if (TR.pack[c.lang] >= 100) { clearInterval(iv); runTranslate(id); } else paintComments(); }, 300);
}
function paintComments() { document.querySelectorAll('.comments-wrap, .ytcom').forEach(w => { w.innerHTML = commentsView(); }); }

function openEditor(id) {
  const n = notesOf()[id];
  E.id = id; E.draft = JSON.parse(JSON.stringify(n || { verdict:'none', summary:'', liked:'', reasons:[], reasonText:'', moments:[] })); E.dirty = false; E.status = n ? 'saved' : 'new'; E.mErr = '';
  const w = document.createElement('div'); w.className = 'editor-wrap'; w.id = 'editor';
  w.addEventListener('click', e => { if (e.target === w) askCloseEditor(); });
  $('#device').appendChild(w); paintEditor();
  const f = w.querySelector('textarea, input'); if (f && !isMob()) f.focus();
}
function paintEditor() {
  const w = $('#editor'); if (!w) return;
  const a = DATA.find(x => x.id === E.id), d = E.draft, dropped = a.st === 'DROPPED';
  const stLine = { new:'Новая заметка', saved:'Сохранено' + (notesOf()[E.id] && notesOf()[E.id].at ? ' · ' + notesOf()[E.id].at : ''), dirty:'Есть несохранённые изменения', saving:'Сохраняем…', error:'' }[E.dirty && E.status !== 'error' ? 'dirty' : E.status];
  w.innerHTML = `<div class="editor" role="dialog" aria-modal="true" aria-label="Заметка: ${esc(a.t)}">
    <header class="ed-head"><button class="icon-btn" type="button" data-act="nClose" aria-label="Закрыть">${ic(isMob() ? 'back' : 'DROPPED')}</button><div style="min-width:0"><div class="overline">Моя заметка</div><h2>${esc(a.t)}</h2></div></header>
    <div class="ed-body">
      ${dropped || d.reasons.length || d.reasonText ? `<section class="ed-sec"><h3>Почему бросили</h3><div class="row-chips">${DROP_CHIPS.map(c => `<button class="chip" type="button" data-nchip="${esc(c)}" aria-pressed="${d.reasons.includes(c)}">${esc(c)}</button>`).join('')}</div>
        <label class="field"><span>Своими словами</span><textarea id="nReasonText" rows="2" placeholder="Например: после 4-й серии потерял интерес">${esc(d.reasonText)}</textarea></label></section>` : ''}
      <section class="ed-sec"><label class="field"><span>Что понравилось</span><textarea id="nLiked" rows="2" placeholder="Музыка, персонажи, отдельные серии…">${esc(d.liked)}</textarea></label></section>
      <section class="ed-sec"><h3>Запомнившиеся моменты</h3>
        ${d.moments.length ? `<ul class="moments">${d.moments.map((m, i) => `<li><span class="mm num">Серия ${m.ep} · ${esc(m.t)}</span><span class="mt">${esc(m.text)}</span><button class="icon-btn" type="button" data-mdel="${i}" aria-label="Удалить момент «${esc(m.text)}»">${ic('DROPPED')}</button></li>`).join('')}</ul>` : '<div class="cap">Пока нет. Добавьте серию, время и пару слов.</div>'}
        <div class="madd"><label class="field"><span>Серия</span><select id="nmEp" class="select">${Array.from({length:a.ep}, (_, i) => `<option${i + 1 === curEp(a) ? ' selected' : ''}>${i + 1}</option>`).join('')}</select></label>
          <label class="field"><span>Время</span><input id="nmT" inputmode="numeric" placeholder="мм:сс" maxlength="5" value="${fmtT(P.t)}"></label>
          <label class="field grow"><span>Что произошло</span><input id="nmText" maxlength="80" placeholder="Коротко"></label>
          <button class="btn btn-outline" type="button" data-act="nmAdd">${ic('plus')}Добавить</button></div>
        ${E.mErr ? `<div class="dlg-err">${esc(E.mErr)}</div>` : ''}</section>
      <section class="ed-sec"><h3>Вердикт</h3><div class="seg vseg" role="radiogroup" aria-label="Вердикт">${Object.entries(VERD).map(([k, v]) => `<button type="button" role="radio" data-nverdict="${k}" aria-pressed="${d.verdict === k}" aria-checked="${d.verdict === k}"><span style="color:var(${v.v});display:inline-flex">${ic(v.icon)}</span>${v.label}</button>`).join('')}</div></section>
      <section class="ed-sec"><label class="field"><span>Итог одной-двумя строками <b class="num" id="nSumCount">${d.summary.length}/140</b></span><textarea id="nSum" rows="2" maxlength="140" placeholder="Это увидите в «Моих списках» под названием">${esc(d.summary)}</textarea></label></section>
    </div>
    <footer class="ed-foot">${E.status === 'error' ? `<div class="ed-err" role="alert">${ic('cloud_off')}<span>Не удалось сохранить: нет связи с хранилищем. Изменения не потеряны — они остаются в редакторе.</span></div>` : `<span class="cap" role="status">${E.status === 'saved' && !E.dirty ? ic('check') : ''}${esc(stLine || '')}</span>`}
      <span class="grow"></span><label class="cap demo-fail"><input type="checkbox" id="nFail" ${E.failNext ? 'checked' : ''}> Демо: ошибка сохранения</label>
      <button class="btn btn-filled" type="button" data-act="nSave" ${!E.dirty && E.status !== 'error' ? 'disabled' : ''}>${E.status === 'error' ? 'Повторить' : 'Сохранить'}</button></footer>
  </div>`;
}
function editorInput(id, v) {
  const d = E.draft; if (!d) return;
  if (id === 'nReasonText') d.reasonText = v; else if (id === 'nLiked') d.liked = v; else if (id === 'nSum') { d.summary = v; const c = $('#nSumCount'); if (c) c.textContent = v.length + '/140'; } else return;
  if (!E.dirty) { E.dirty = true; paintEditorFoot(); }
}
function paintEditorFoot() { const keep = document.activeElement && document.activeElement.id, pos = document.activeElement && document.activeElement.selectionStart; paintEditor(); if (keep && $('#' + keep)) { const el = $('#' + keep); el.focus(); try { el.setSelectionRange(pos, pos); } catch(e) {} } }
function saveNote(thenClose) {
  E.status = 'saving'; paintEditor();
  setTimeout(() => {
    if (E.failNext) { E.status = 'error'; E.failNext = false; paintEditor(); return; }
    const d = E.draft; const empty = !d.summary && !d.liked && !d.reasonText && !d.reasons.length && !d.moments.length && d.verdict === 'none';
    if (empty) delete notesOf()[E.id]; else notesOf()[E.id] = Object.assign(JSON.parse(JSON.stringify(d)), { at:'только что' });
    E.dirty = false; E.status = 'saved';
    if (thenClose) { closeEditor(); toast(empty ? 'Пустая заметка удалена' : 'Заметка сохранена'); } else paintEditor();
    const keepE = $('#editor'); render(); if (keepE && !$('#editor')) $('#device').appendChild(keepE);
  }, 450);
}
function askCloseEditor() {
  if (!E.dirty) { closeEditor(); return; }

    <div class="dlg-acts"><button class="btn btn-text" type="button" data-dlg="close">Продолжить редактирование</button><button class="btn btn-outline" type="button" data-act="nDiscard">Не сохранять</button><button class="btn btn-filled" type="button" data-act="nSaveClose">Сохранить</button></div>`);
}
function closeEditor() { const w = $('#editor'); if (w) w.remove(); E.id = null; E.draft = null; E.dirty = false; }

/* ---------- Карточка тайтла ---------- */
const HIST = [420,310,520,900,2400,6100,15800,31200,28400,14100];
const SDIST = { CURRENT:98000, PLANNING:210000, COMPLETED:245000, PAUSED:9000, DROPPED:7000 };
function histogram() {
  const W = 520, H = 200, pl = 8, pb = 24, pt = 20, max = 35000;
  const bw = (W - pl * 2) / HIST.length, gap = 8;
  const y = v => pt + (H - pt - pb) * (1 - v / max);
  const top3 = [...HIST].sort((a,b) => b-a).slice(0,3);
  return `<div class="chart" id="hist"><svg viewBox="0 0 ${W} ${H}" role="img" aria-label="Распределение оценок AniList">
    <line x1="${pl}" x2="${W-pl}" y1="${H-pb}" y2="${H-pb}" stroke="var(--border-strong)"/>
    ${HIST.map((v,i) => { const x = pl + i * bw + gap/2, w = bw - gap, yy = y(v), h = H - pb - yy;
      return `<g data-i="${i}"><rect class="hit" x="${pl + i*bw}" y="${pt}" width="${bw}" height="${H-pt}"/>
        <path class="bar" d="M${x},${H-pb} V${yy+4} q0,-4 4,-4 h${w-8} q4,0 4,4 V${H-pb} z" fill="var(--accent)"/>
        ${top3.includes(v) ? `<text class="val" x="${x + w/2}" y="${yy - 6}" text-anchor="middle">${fmtK(v)}</text>` : ''}
        <text x="${x + w/2}" y="${H - 6}" text-anchor="middle">${(i+1)*10}</text></g>`; }).join('')}
  </svg><div class="tip" hidden></div></div>`;
}
function viewTitle() {

  }
  if (S.titleTab === 'comments') body = `<div class="comments-wrap">${commentsView()}</div>`;
  if (S.titleTab === 'similar') body = `<div class="hscroll">${DATA.filter(x => x.id !== a.id).slice(0,8).map(card).join('')}</div>`;
  return `<div class="page">
    <div class="mnav"><a href="#catalog" aria-label="Назад">${plat() === 'ios' ? `<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M15.4 4 7.4 12l8 8 1.4-1.4L10.2 12l6.6-6.6z"/></svg>Каталог` : ic('back')}</a></div>
    <div class="hero"><div class="banner" style="background:linear-gradient(120deg, hsl(${a.h} 50% 30%), hsl(${a.h+60} 55% 18%))"></div>
      <div class="hero-row"><div class="poster">${art(a, true)}</div>
        <div class="hero-info">
          <div><h1 lang="ru">${esc(a.t)}</h1>${EN_TITLE[a.id] && EN_TITLE[a.id] !== a.t ? `<div class="meta en-title" lang="en" title="Ромадзи: ${esc(a.o)}">${esc(EN_TITLE[a.id])}</div>` : `<div class="meta">${esc(a.o)}</div>`}</div>
          <div class="meta">${a.adult ? '<span class="tag adult-tag">18+</span> ' : ''}${a.f} · ${a.s} ${a.y} · ${a.ep} эп. · ${a.d} мин${a.studio ? ' · ' + a.studio : ''}</div>
          <div class="scoreblock">

  else if (t.id === 'fsBtn') toggleFs();
  else if (t.id === 'nextBtn' || t.id === 'goNext') goNext();
  else if (t.id === 'cancelNext') { clearNext(); P.next = { cancelled:true }; }
  else if (t.id === 'prevBtn') { const a = DATA.find(x => x.id === S.titleId) || DATA[0]; const c = curEp(a); if (c > 1) { P.ep = c - 1; P.t = 0; P.marked = false; clearNext(); render(); toast(`Серия ${P.ep}`, null, null, true); } }
  else if (t.id === 'volBtn') { P.muted = !P.muted; t.innerHTML = ic(P.muted ? 'vol_off' : 'vol'); t.setAttribute('aria-pressed', P.muted); t.setAttribute('aria-label', P.muted ? 'Включить звук' : 'Выключить звук'); toast(P.muted ? 'Звук выключен' : 'Звук включён', null, null, true); }
  else if (t.id === 'plSetBtn') { P.setOpen = !P.setOpen; P.dubOpen = false; $('#dubPop').hidden = true; $('#plSetPop').hidden = !P.setOpen; t.setAttribute('aria-expanded', P.setOpen); showUi(); }
  else if (d.rate) { P.rate = +d.rate; P.setOpen = false; render(); toast(`Скорость: ${P.rate === 1 ? 'обычная' : P.rate + '×'}`, null, null, true); }
  else if (d.q) { P.q = d.q; P.setOpen = false; render(); toast(`Качество: ${P.q}`, null, null, true); }
  else if ((t.id === 'epBtn' || d.act === 'epClose') && $('#player.yt')) { P.epOpen = !P.epOpen; render(); }
  else if (t.id === 'epBtn' || d.act === 'epClose') { P.epOpen = !P.epOpen; $('#eppanel').hidden = !P.epOpen; if (P.epOpen) { const nw = $('#eppanel .now'); if (nw) nw.scrollIntoView({ block:'center' }); } $('#epBtn').setAttribute('aria-expanded', P.epOpen); showUi(); }
  else if (d.season) { P.season = +d.season; $('#eppanel').innerHTML = epPanel(DATA.find(x => x.id === S.titleId) || DATA[0], YT_OK($('#demoPlayer').value)); }
  else if (d.ep) { const a = DATA.find(x => x.id === S.titleId) || DATA[0]; if (P.season === 0) P.ep = +d.ep; P.t = 0; P.marked = false; P.epOpen = false; render(); toast(`Серия ${d.ep}`, null, null, true); }
  else if (d.act === 'pickDub') { P.dubOpen = true; $('#dubPop').hidden = false; showUi(); }
  else if (d.act === 'plRetry') { $('#demoPlayer').value = 'loading'; render(); setTimeout(() => { $('#demoPlayer').value = 'play'; P.playing = true; render(); }, 1200); }
  else if (d.act === 'markEp') { markWatched(); render(); }
  else if (d.act === 'rateLater') toast('Диалог оценки отложен до следующего прохода', null, null, true);
  else if (d.act === 'ytEps') { P.epOpen = true; render(); }
  else if (d.act === 'ytNext') { const a = DATA.find(x => x.id === S.titleId) || DATA[0]; P.ep = Math.min(a.ep, curEp(a) + 1); P.marked = false; $('#demoPlayer').value = 'yt'; render(); toast('Следующая серия', null, null, true); }
  else if (d.act === 'ytStay') { $('#demoPlayer').value = 'yt'; render(); }
  else if (t.id === 'musicBtn') { if (P.mus) closeMusic(); else { P.dubOpen = false; $('#dubPop').hidden = true; runMusic(); } }
  else if (d.mus === 'enable') { S.music = true; runMusic(); }
  else if (d.mus === 'run') runMusic();
  else if (d.mus === 'close') closeMusic();
  else if (d.mus === 'copy') { try { navigator.clipboard.writeText('Creepy Nuts — Otonoke').catch(() => {}); } catch(e) {} toast('Скопировано: Creepy Nuts — Otonoke', null, null, true); }
  else if (t.id === 'setMusic') { S.music = !S.music; t.setAttribute('aria-checked', S.music); }
  else if (t.id === 'dubBtn') { closeMusic(); P.setOpen = false; if ($('#plSetPop')) $('#plSetPop').hidden = true; P.dubOpen = !P.dubOpen; $('#dubPop').hidden = !P.dubOpen; t.setAttribute('aria-expanded', P.dubOpen); showUi(); }
  else if (d.pdub) { S.dub = +d.pdub; P.dubOpen = false; if ($('#demoPlayer').value === 'error') $('#demoPlayer').value = 'play'; render(); toast(`Озвучка: ${DUBS[S.dub].n}. Позиция сохранена`, null, null, true); }
  if (!t.closest('.actions')) { const m = $('#statusMenu'); if (m) m.hidden = true; }
});
document.addEventListener('click', e => {
  if (!$('#player')) return;
  const inside = e.target.closest('.pop, #dubBtn, #plSetBtn, #musicBtn, [data-act=pickDub]');
  if (!inside) {
    if (P.dubOpen) { P.dubOpen = false; $('#dubPop').hidden = true; if ($('#dubBtn')) $('#dubBtn').setAttribute('aria-expanded', false); }
    if (P.setOpen) { P.setOpen = false; $('#plSetPop').hidden = true; }
    syncPlayerUi();
  }
}, true);
document.addEventListener('click', e => { if (!e.target.closest('#pmenu') && !e.target.closest('[data-act="pmenu"]')) { const m = $('#pmenu'); if (m) m.remove(); } if (!e.target.closest('.actions')) { const m = $('#statusMenu'); if (m) m.hidden = true; } }, true);
document.addEventListener('change', e => {
  if (e.target.id === 'sort') { S.sort = e.target.value; render(); }
  if (e.target.id === 'demoPlatform') render();
  if (e.target.id === 'demoTrailer') { TRL.searched = {}; TRL.found = {}; TRL.searching = null; TRL.fail = {}; if (route() === 'title') render(); else location.hash = 'title'; }
  if (e.target.id === 'trDemo') { C.trDemo = e.target.value; TR.st = {}; TR.showOrig.clear(); TR.pack = {}; TR.pending = null; paintComments(); }
  if (e.target.id === 'demoComments') { C.more = false; paintComments(); }
  if (e.target.id === 'nFail') E.failNext = e.target.checked;
  if (e.target.id === 'demoPlayer' && e.target.value === 'play') P.playing = true;
  if (e.target.id === 'demoPlayer') { if (route() === 'player' || route() === 'title') render(); else location.hash = 'player'; }
  if (e.target.id === 'musDemo') { S.musicDemo = e.target.value; runMusic(); }
  if (e.target.id === 'demoSync') prof().sync = e.target.value;
  if (e.target.id === 'demoSync') { if (e.target.value === 'out') S.login = 'start'; render(); }
  if (e.target.id === 'demoState') { if (route() === 'search') paintSearch(); else if (route() !== 'catalog') location.hash = 'catalog'; else render(); }
  if (e.target.id === 'setLang') S.lang = e.target.value;
  if (e.target.id === 'setLang') toast(e.target.value === 'en' ? 'Language: English. Перевод интерфейса — после первого прохода' : 'Язык: русский');
});
document.addEventListener('pointerdown', e => {
  const pl = e.target.closest('#player');
  if (pl && pl.classList.contains('hide-ui')) { e.preventDefault(); P.swallow = true; setTimeout(() => { P.swallow = false; }, 600); showUi(); return; }
}, true);
document.addEventListener('click', e => { if (P.swallow) { P.swallow = false; e.stopPropagation(); e.preventDefault(); } }, true);
document.addEventListener('pointerdown', e => {
  const tl = e.target.closest('#tl'); if (!tl) return;
  const seek = ev => { const r = tl.getBoundingClientRect(); P.t = Math.max(0, Math.min(1, (ev.clientX - r.left) / r.width)) * P.dur; if (P.t < P.dur - 20 && P.next && P.next.iv) clearNext(); playerPaint(); };
  seek(e); tl.setPointerCapture(e.pointerId);
  tl.onpointermove = seek; tl.onpointerup = () => { tl.onpointermove = null; };
});
document.addEventListener('pointermove', e => {
  if ($('#player')) showUi();
  const g = e.target.closest('#hist g'); const tip = $('#hist .tip');
  if (!tip) return;
  document.querySelectorAll('#hist g.on').forEach(x => x.classList.remove('on'));
  if (!g) { tip.hidden = true; return; }
  g.classList.add('on');
  const i = +g.dataset.i, box = $('#hist').getBoundingClientRect(), r = g.querySelector('.bar').getBoundingClientRect();
  tip.innerHTML = `<b>${(i+1)*10} баллов</b> · ${fmtK(HIST[i])} чел.`;
  tip.style.left = (r.left + r.width / 2 - box.left) + 'px'; tip.style.top = (r.top - box.top - 26) + 'px'; tip.hidden = false;
});
document.addEventListener('keydown', e => {
  if ((e.ctrlKey || e.metaKey) && e.code === 'KeyK') { e.preventDefault(); if (route() !== 'search') location.hash = 'search'; else $('#sq') && $('#sq').focus(); }
  if (e.key === 'Escape' && e.target.id === 'sq') { SQ = ''; e.target.value = ''; paintSearch(); }
  if (e.key === 'Escape' && $('#sheet')) { closeSheet(); return; }
  if (e.key === 'Escape' && $('#dialog')) { closeDialog(); return; }
  if (e.key === 'Escape' && $('#editor')) { askCloseEditor(); return; }
  if (e.key === 'Enter' && e.target.id === 'nmText') { e.preventDefault(); document.querySelector('[data-act="nmAdd"]').click(); return; }
  if (e.key === 'Escape' && $('#pmenu')) { $('#pmenu').remove(); return; }
  if (e.key === 'Enter' && e.target.id === 'pfName') { $('[data-act="pfCreate"]').click(); }
  if (!$('#player')) return;
  showUi();
  if (e.code === 'Space' && !/^(INPUT|SELECT|TEXTAREA)$/.test(e.target.tagName)) { e.preventDefault(); P.playing = !P.playing; render(); }
  if (e.key === 'ArrowLeft') { P.t = Math.max(0, P.t - 10); playerPaint(); }
  if (e.key === 'ArrowRight') { P.t = Math.min(P.dur, P.t + 10); playerPaint(); }
  if (e.code === 'KeyS' && !$('#skip').hidden) { P.t = P.opB; playerPaint(); }
  if (e.code === 'KeyN' && e.shiftKey) goNext();
  if (e.code === 'KeyM' && $('#volBtn')) $('#volBtn').click();
  if (e.code === 'KeyF' && !e.ctrlKey && !e.metaKey && e.target.tagName !== 'INPUT') toggleFs();
  if (e.key === 'Escape' && P.fs && !(P.next && P.next.iv) && !P.dubOpen && !P.mus) { toggleFs(false); return; }
  if (e.key === 'Escape' && P.setOpen) { P.setOpen = false; $('#plSetPop').hidden = true; return; }
  if (e.key === 'Escape' && P.mus) { closeMusic(); return; }
  if (e.key === 'Escape' && P.epOpen) { P.epOpen = false; $('#eppanel').hidden = true; return; }
  if (e.key === 'Escape') { if (P.next && P.next.iv) { clearNext(); P.next = { cancelled:true }; } else if (P.dubOpen) { P.dubOpen = false; $('#dubPop').hidden = true; } }
});
document.addEventListener('click', e => { const tb = $('.titlebar'); if (tb.classList.contains('open') && !e.target.closest('.titlebar')) { tb.classList.remove('open'); $('#protoToggle').setAttribute('aria-expanded', false); $('#protoToggle').textContent = 'Демо-настройки ▾'; } }, true);
$('#protoToggle').onclick = () => { const tb = $('.titlebar'), o = tb.classList.toggle('open'); $('#protoToggle').setAttribute('aria-expanded', o); $('#protoToggle').textContent = o ? 'Скрыть ▴' : 'Демо-настройки ▾'; };
$('#themeBtn').onclick = () => {
  const cur = document.documentElement.dataset.theme || (matchMedia('(prefers-color-scheme: light)').matches ? 'light' : 'dark');
  const nx = cur === 'dark' ? 'light' : 'dark';
  document.documentElement.dataset.theme = nx;
  try { localStorage.setItem('ai-theme', nx); } catch(e) {}
};
(() => { // платформа по умолчанию — по устройству зрителя
  const ua = navigator.userAgent;
  const pf = /iPhone|iPad|iPod/.test(ua) || (/Macintosh/.test(ua) && navigator.maxTouchPoints > 1) ? 'ios' : /Android/.test(ua) ? 'android' : 'windows';
  $('#demoPlatform').value = pf;
})();
render();
</script>
