<style>
/* Страница просмотра каталога для друзей. Один файл, без внешних скриптов.
   Данные: share.json из публичного Gist (?g=<id>). Токены — design/tokens.json (тёмная тема по умолчанию, светлая по системе). */
:root {
  color-scheme: dark;
  --bg:#0E1016; --s1:#161923; --s2:#1E2230; --s3:#272C3D; --border:#2C3144; --border-strong:#3B4159;
  --fg:#ECEEF5; --fg2:#A7ADC0; --fg3:#878EA4; --accent:#8399FF; --on-accent:#0E1016; --accent-soft:#8399FF26;
  --good:#4CC38A; --warn:#E3A73B; --bad:#F27B7B;
  --st-current:#3987E5; --st-planning:#D95926; --st-completed:#199E70; --st-paused:#C98500; --st-dropped:#D55181;
  --skel:#1E2230; --skel-shine:#272C3D; --badge-ground:#0E1016CC; --shadow:0 16px 48px #000000A0;
  --f-display:"Unbounded","Segoe UI",system-ui,sans-serif; --f-text:"Golos Text","Segoe UI",system-ui,-apple-system,sans-serif;
}
@media (prefers-color-scheme: light) { :root:not([data-theme="dark"]) {
  color-scheme: light;
  --bg:#F4F5F9; --s1:#FFFFFF; --s2:#E9EBF2; --s3:#DEE1EA; --border:#D9DCE6; --border-strong:#BFC3D1;
  --fg:#141722; --fg2:#474D62; --fg3:#646A80; --accent:#3150C9; --on-accent:#FFFFFF; --accent-soft:#3150C91F;
  --good:#126F48; --warn:#94580A; --bad:#B9302F;
  --st-current:#2A78D6; --st-planning:#EB6834; --st-completed:#1BAF7A; --st-paused:#EDA100; --st-dropped:#E87BA4;
  --skel:#E9EBF2; --skel-shine:#F4F5F9; --shadow:0 16px 48px #1417222E;
} }
:root[data-theme="light"] {
  color-scheme: light;
  --bg:#F4F5F9; --s1:#FFFFFF; --s2:#E9EBF2; --s3:#DEE1EA; --border:#D9DCE6; --border-strong:#BFC3D1;
  --fg:#141722; --fg2:#474D62; --fg3:#646A80; --accent:#3150C9; --on-accent:#FFFFFF; --accent-soft:#3150C91F;
  --good:#126F48; --warn:#94580A; --bad:#B9302F;
  --st-current:#2A78D6; --st-planning:#EB6834; --st-completed:#1BAF7A; --st-paused:#EDA100; --st-dropped:#E87BA4;
  --skel:#E9EBF2; --skel-shine:#F4F5F9; --shadow:0 16px 48px #1417222E;
}
[hidden] { display: none !important; }
* { box-sizing: border-box; }
html { -webkit-text-size-adjust: 100%; }
body { margin: 0; background: var(--bg); color: var(--fg); font: 400 15px/22px var(--f-text); }
button, input, select { font: inherit; color: inherit; }
button { cursor: pointer; background: none; border: 0; padding: 0; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; border-radius: 6px; }
svg { width: 20px; height: 20px; fill: currentColor; flex: none; }
.num { font-variant-numeric: tabular-nums; }
.wrap { max-width: 1200px; margin: 0 auto; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); padding-block: max(16px, env(safe-area-inset-top, 0px)) 48px; }
h1 { font: 600 24px/30px var(--f-display); margin: 0; letter-spacing: -.3px; text-wrap: balance; }
h2 { font: 600 18px/24px var(--f-display); margin: 0; }
.cap { font-size: 13px; line-height: 18px; color: var(--fg2); }
.muted { color: var(--fg3); }

/* шапка */
.top { display: flex; gap: 12px; align-items: flex-start; justify-content: space-between; margin-bottom: 16px; }
.top .who { display: grid; gap: 4px; min-width: 0; }
.brand { font: 600 11px/14px var(--f-text); letter-spacing: .08em; text-transform: uppercase; color: var(--fg3); }
.iconbtn { width: 40px; height: 40px; border-radius: 50%; display: grid; place-items: center; color: var(--fg2); }
.iconbtn:hover { background: var(--s2); color: var(--fg); }

/* вкладки и инструменты */
.tabs { display: flex; gap: 6px; overflow-x: auto; scrollbar-width: none; margin: 0 calc(-1 * max(16px, env(safe-area-inset-right, 0px))) 12px 0; padding-right: 16px; -webkit-mask-image: linear-gradient(90deg, #000 88%, transparent); mask-image: linear-gradient(90deg, #000 88%, transparent); }
.tabs::-webkit-scrollbar { display: none; }
.tab { flex: none; height: 36px; padding: 0 12px; border-radius: 999px; border: 1px solid var(--border); background: var(--s1); display: inline-flex; gap: 6px; align-items: center; font-size: 14px; font-weight: 500; color: var(--fg2); }
.tab[aria-selected="true"] { background: var(--accent-soft); border-color: transparent; color: var(--accent); }
.tab .c { font-size: 12px; padding: 0 6px; border-radius: 999px; background: var(--s2); color: var(--fg2); }
.tab[aria-selected="true"] .c { background: var(--accent); color: var(--on-accent); }
.tab svg { width: 16px; height: 16px; }
.tools { display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 8px; margin-bottom: 16px; }
.search { display: flex; gap: 8px; align-items: center; height: 44px; padding: 0 12px; border: 1px solid var(--border); border-radius: 10px; background: var(--s1); color: var(--fg3); }
.search input { flex: 1; min-width: 0; border: 0; background: none; outline: none; color: var(--fg); font-size: 16px; -webkit-appearance: none; appearance: none; }
select { height: 44px; border: 1px solid var(--border); border-radius: 10px; background: var(--s1); padding: 0 10px; font-size: 16px; }

/* список: телефон — строки, ПК — сетка */
.list { display: grid; gap: 8px; }
.row { display: grid; grid-template-columns: 64px minmax(0, 1fr); gap: 12px; align-items: start; text-align: left; padding: 8px; border-radius: 12px; background: var(--s1); border: 1px solid var(--border); width: 100%; }
.row:active { background: var(--s2); }
.cover { position: relative; width: 64px; aspect-ratio: 2 / 3; border-radius: 8px; overflow: hidden; background: var(--s3); }
.cover img, .cover .ph { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; }
.cover .ph { display: grid; place-items: center; font: 600 22px var(--f-display); color: #FFFFFFB3; }
.info { display: grid; gap: 4px; min-width: 0; }
.name { font-weight: 600; line-height: 20px; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
.meta { display: flex; flex-wrap: wrap; gap: 4px 10px; align-items: center; font-size: 13px; color: var(--fg2); }
.score { font-weight: 600; font-variant-numeric: tabular-nums; }
.score.good { color: var(--good); } .score.warn { color: var(--warn); } .score.bad { color: var(--bad); }
.score small { font-weight: 500; color: var(--fg3); margin-left: 3px; font-size: 11px; }
.st { display: inline-flex; gap: 4px; align-items: center; }
.st i { width: 8px; height: 8px; border-radius: 50%; display: inline-block; }
.heart { color: var(--bad); display: inline-flex; }
.heart svg { width: 16px; height: 16px; }
.adult { font-size: 11px; font-weight: 600; padding: 0 6px; border-radius: 4px; background: #B9302F; color: #FFFFFF; line-height: 18px; }
.sum { font-size: 13px; line-height: 18px; color: var(--fg2); display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
.verdict { display: inline-flex; gap: 4px; align-items: center; font-weight: 600; font-size: 13px; }
.verdict svg { width: 15px; height: 15px; }
@media (min-width: 720px) {
  .list { grid-template-columns: repeat(auto-fill, minmax(260px, 1fr)); gap: 12px; }
  .row { grid-template-columns: 80px minmax(0, 1fr); }
  .cover { width: 80px; }
  .row:hover { border-color: var(--border-strong); }
  h1 { font-size: 30px; line-height: 36px; }
}

/* карточка тайтла: шит снизу на телефоне, окно на ПК */
.sheet-wrap { position: fixed; inset: 0; z-index: 20; background: #00000099; display: flex; align-items: flex-end; justify-content: center; }
.sheet { width: 100%; max-height: 92dvh; overflow-y: auto; overscroll-behavior: contain; background: var(--s1); border-radius: 20px 20px 0 0; padding: 8px 16px max(20px, env(safe-area-inset-bottom, 0px)); box-shadow: var(--shadow); }
.sheet::before { content: ""; display: block; width: 36px; height: 4px; border-radius: 2px; background: var(--border-strong); margin: 4px auto 12px; }
@media (min-width: 720px) { .sheet-wrap { align-items: center; } .sheet { width: min(560px, calc(100% - 32px)); border-radius: 20px; padding: 20px 24px 24px; } .sheet::before { display: none; } }
.d-head { display: grid; grid-template-columns: 96px minmax(0, 1fr) auto; gap: 14px; align-items: start; }
.d-head .cover { width: 96px; }
.d-head h2 { text-wrap: balance; }
.d-en { font-size: 13px; color: var(--fg2); margin-top: 2px; }
.d-score { font: 600 22px/26px var(--f-display); font-variant-numeric: tabular-nums; margin-top: 8px; }
.d-score small { font: 500 13px var(--f-text); color: var(--fg3); }
.d-sec { display: grid; gap: 8px; margin-top: 18px; }
.d-sec h3 { margin: 0; font-size: 13px; font-weight: 600; letter-spacing: .06em; text-transform: uppercase; color: var(--fg3); }
.d-sec p { margin: 0; }
.chips { display: flex; gap: 6px; flex-wrap: wrap; }
.chip { font-size: 12px; padding: 2px 8px; border-radius: 6px; background: var(--s2); color: var(--fg2); }
.moments { list-style: none; margin: 0; padding: 0; display: grid; gap: 4px; }
.moments li { display: grid; grid-template-columns: auto minmax(0, 1fr); gap: 10px; padding: 6px 10px; border-radius: 8px; background: var(--s2); font-size: 14px; }
.moments b { color: var(--accent); font-size: 12px; font-weight: 600; white-space: nowrap; font-variant-numeric: tabular-nums; }
.btn { height: 44px; padding: 0 16px; border-radius: 10px; display: inline-flex; gap: 8px; align-items: center; justify-content: center; font-weight: 600; text-decoration: none; }
.btn-filled { background: var(--accent); color: var(--on-accent); }
.btn-outline { border: 1px solid var(--border-strong); color: var(--fg); }

/* состояния */
.state { display: grid; justify-items: center; gap: 10px; text-align: center; padding: 48px 16px; color: var(--fg2); }
.state svg { width: 44px; height: 44px; color: var(--fg3); }
.state h2 { color: var(--fg); }
.paste { display: grid; gap: 12px; max-width: 480px; margin: 12vh auto 0; }
.paste input { height: 48px; border: 1px solid var(--border-strong); border-radius: 12px; background: var(--s1); padding: 0 14px; font-size: 16px; color: var(--fg); }
.paste .err { color: var(--bad); font-size: 14px; }
.skel { background: linear-gradient(100deg, var(--skel) 30%, var(--skel-shine) 50%, var(--skel) 70%); background-size: 300% 100%; animation: shine 1.2s linear infinite; border-radius: 6px; }
@keyframes shine { from { background-position: 100% 0; } to { background-position: -50% 0; } }
.foot { margin-top: 28px; font-size: 12px; line-height: 18px; color: var(--fg3); }
@media (prefers-reduced-motion: reduce) { .skel { animation: none; } }
</style>
</head>

<script>
'use strict';

/* ---------- справочники ---------- */
const TABS = [
  ['CURRENT', 'Смотрю', '--st-current'], ['COMPLETED', 'Просмотрено', '--st-completed'], ['PLANNING', 'В планах', '--st-planning'],
  ['FAV', 'Понравилось', '--bad'], ['PAUSED', 'Отложено', '--st-paused'], ['DROPPED', 'Брошено', '--st-dropped'], ['NOTES', 'Заметки', '--accent'],
];
const STATUS = { CURRENT:'Смотрю', REPEATING:'Пересматривает', COMPLETED:'Просмотрено', PLANNING:'В планах', PAUSED:'Отложено', DROPPED:'Брошено' };
const STATUS_V = { CURRENT:'--st-current', REPEATING:'--st-current', COMPLETED:'--st-completed', PLANNING:'--st-planning', PAUSED:'--st-paused', DROPPED:'--st-dropped' };
const VERD = { rewatch:['Стоит пересмотреть', 'rw', '--accent'], recommend:['Советует', 'up', '--good'], not:['Не советует', 'down', '--bad'], none:['Без вердикта', 'dash', '--fg3'] };
const SRC = { shikimori:['Shikimori', 'Shiki'], anilist:['AniList', 'AL'] };
const scoreCls = v => v >= 7.5 ? 'good' : v >= 6 ? 'warn' : 'bad';
const fmtScore = v => v.toFixed(1).replace('.', ',');
const plural = (n, a, b, c) => { const m10 = n % 10, m100 = n % 100; return m10 === 1 && m100 !== 11 ? a : m10 >= 2 && m10 <= 4 && (m100 < 12 || m100 > 14) ? b : c; };
const fmtDate = iso => { const d = new Date(iso); if (isNaN(d)) return ''; return d.toLocaleString('ru-RU', { day:'numeric', month:'long', hour:'2-digit', minute:'2-digit' }); };
const safeYouTube = u => { try { const x = new URL(u); return /^(www\.|m\.)?youtube\.com$|^youtu\.be$/.test(x.hostname) && x.protocol === 'https:' ? x.href : null; } catch (e) { return null; } };
const safeImg = u => { try { const x = new URL(u); return x.protocol === 'https:' ? x.href : null; } catch (e) { return null; } };

/* ---------- данные ---------- */
// Проверка формата share.json (v1). Неизвестные поля игнорируются; битые записи пропускаются.
function normalize(j) {
  if (!j || typeof j !== 'object' || !Array.isArray(j.titles)) throw new Error('format');

// Загрузка: GitHub API (CORS открыт, 60 запросов в час с одного адреса без входа), файл share.json из Gist.
async function load(id) {
  const r = await fetch(`https://api.github.com/gists/${id}`, { headers: { Accept: 'application/vnd.github+json' } });

  return normalize(JSON.parse(text));

/* ---------- состояние страницы ---------- */
const S = { data: null, tab: 'CURRENT', q: '', sort: 'score', open: null };
const app = document.getElementById('app');
const params = new URLSearchParams(location.search);

function header(d) {

    el('div', { class:'who' }, el('span', { class:'brand', text:'Anilist · каталог' }), el('h1', { text: d && d.owner ? `Каталог · ${d.owner}` : 'Каталог друга' }),
      d && d.updatedAt ? el('span', { class:'cap', text:`Обновлено ${fmtDate(d.updatedAt)}` }) : null),

  const c = el('div', { class:'cover', style: t.color ? `background:${t.color}` : null });
  const ph = el('span', { class:'ph', text: titleOf(t).slice(0, 1).toUpperCase() });
